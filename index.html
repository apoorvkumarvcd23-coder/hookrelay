<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HookRelay</title>
<style>body{font:16px system-ui;max-width:950px;margin:40px auto;padding:20px;background:#f5f7fa;color:#16263a}section{background:white;padding:24px;border-radius:12px;margin:20px 0}input,button{font:inherit;padding:10px;margin:5px}input{width:70%}button{background:#174873;color:white;border:0;border-radius:5px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}small{color:#52657b}</style>
<h1>HookRelay</h1><p>Inspect signed callbacks, retry failures and recover dead-letter jobs.</p><small>Local prototype · JSON and flat XML · synthetic provider · no paid services</small>
<section><label>API key <input id="key" type="password" autocomplete="off"></label></section>
<section><h2>Send a signed fixture</h2><button id="json">JSON event</button><button id="xml">XML event</button><pre id="result" role="status"></pre></section>
<section><h2>Delivery queue</h2><button id="work">Process next due job</button><button id="refresh">Refresh</button><div id="jobs"></div></section>
<script>
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+document.getElementById('key').value},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
const result=document.getElementById('result');
async function action(path,body){try{result.textContent=JSON.stringify(await api(path,body),null,2);await refresh()}catch(e){result.textContent=e.message}}
async function refresh(){const box=document.getElementById('jobs');box.replaceChildren();try{for(const job of await api('/jobs')){const p=document.createElement('p');p.textContent=`${job.id} · ${job.state} · ${job.attempts} attempt(s)${job.last_error?' · '+job.last_error:''}`;box.append(p);if(job.state==='dead'){const b=document.createElement('button');b.textContent='Replay';b.onclick=()=>action('/replay/'+encodeURIComponent(job.id),{});box.append(b)}}}catch(e){box.textContent=e.message}}
document.getElementById('json').onclick=()=>action('/fixtures',{format:'json'});document.getElementById('xml').onclick=()=>action('/fixtures',{format:'xml'});document.getElementById('work').onclick=()=>action('/worker',{});document.getElementById('refresh').onclick=refresh;
</script></html>
